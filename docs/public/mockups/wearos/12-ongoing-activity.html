<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoDex Wear · 常驻活动 / Live Update（长任务在表盘上的存在感）</title>
<link rel="stylesheet" href="styles.css">
<style>
  .ongoing {
    width:100%; max-width:330px; display:flex; align-items:center; gap:11px;
    padding:12px 14px; border-radius:24px;
    background:#101c1f; border:1px solid rgba(56,189,248,.35);
  }
  .ring-sm { position:relative; width:44px; height:44px; flex:0 0 auto; }
  .ring-sm .pct {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .arc-sm { transform: rotate(-90deg); transform-origin: 22px 22px; }
  .pill-time { font-size:11px; color:var(--wg-dim); font-variant-numeric: tabular-nums; }
  .wf-mini {
    width:150px; height:150px; border-radius:50%; margin:0 auto;
    background:radial-gradient(circle at 50% 35%, #16202a, #04070a 70%);
    border:1px solid var(--wg-border);
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  .wf-mini .hm { font-size:30px; font-weight:300; font-variant-numeric:tabular-nums; }
  .wf-mini .active-chip {
    position:absolute; bottom:19px; left:0; right:0; display:flex; justify-content:center;
  }
</style>
</head>
<body class="watch">
<div class="screen" style="padding:26px 22px 22px">
  <div class="st-top" style="width:190px">
    <span class="mini">常驻活动</span>
    <span class="pill-time">已运行 12:04</span>
  </div>

  <div class="center" style="gap:14px">
    <div class="ongoing">
      <div class="ring-sm">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="18" fill="none" stroke="#1c2a2f" stroke-width="4"/>
          <circle class="arc-sm" cx="22" cy="22" r="18" fill="none" stroke="#38bdf8" stroke-width="4"
                  stroke-linecap="round" stroke-dasharray="53 113"/>
        </svg>
        <div class="pct">47%</div>
      </div>
      <div style="flex:1;min-width:0">
        <div class="t-sm truncate">重构 auth 中间件</div>
        <div style="font-size:11.5px;color:var(--wg-muted);margin-top:2px">PC-01 · 第 4/9 步</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#38bdf8"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div class="mini" style="max-width:300px;text-align:center">
      长任务在腕上有一个「正在进行」的入口：<br>表盘底部小图标 + 下拉通知栏常驻项
    </div>

    <div class="wf-mini">
      <div class="hm">10:09</div>
      <div class="active-chip">
        <span class="chip accent" style="padding:3px 9px;font-size:10.5px">
          <span class="dot busy"></span> 2 运行中 · 1 待审批
        </span>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="mini">点按常驻项 → 直接回到任务详情</div>
  </div>
</div>
</body>
</html>
