apply plugin: 'com.android.application'

android {
    namespace = "com.godex.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.godex.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // 关键：强制把 jniLibs 的 .so 解压到 nativeLibraryDir（而非直接从 APK 映射）。
    // 本地模式需 exec libgodex.so / libbusybox.so / libgit.so —— 只有落盘到
    // /data/app/.../lib/arm64（app_lib_file 类型）才能通过 SELinux exec 检查。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- 本地模式 native runtime ----
// 普通 Gradle 构建只检查产物；工具链和网络操作必须显式调用 prepare task。
def nativeLibsDir = file('src/main/jniLibs/arm64-v8a')
def godexLibrary = file("${nativeLibsDir}/libgodex.so")
def runtimeLibraries = ['libbusybox.so', 'libgit.so', 'libgitremotehttps.so']
def requiredNativeLibraries = ['libgodex.so'] + runtimeLibraries
def missingNativeLibraries = {
    requiredNativeLibraries.findAll { !file("${nativeLibsDir}/${it}").isFile() }
}
def missingRuntimeLibraries = {
    runtimeLibraries.findAll { !file("${nativeLibsDir}/${it}").isFile() }
}
def nativeBuildScripts = file("${rootProject.projectDir.parentFile}/scripts")

tasks.register('prepareGodexNativeRuntime') {
    group = 'build setup'
    description = 'Explicitly build missing Godex Android native runtime libraries.'
    doLast {
        def missingRuntime = missingRuntimeLibraries()
        def forceGodexBuild = project.hasProperty('forceGodexBuild')
        def needsGodexBuild = !godexLibrary.isFile() || forceGodexBuild
        if (missingRuntime.isEmpty() && !needsGodexBuild) {
            println 'jniLibs/arm64-v8a native libraries are ready'
            return
        }

        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            throw new GradleException('Run native preparation from Git Bash / WSL: ' +
                    'bash mobile/scripts/build-android-runtime.sh && ' +
                    'bash mobile/scripts/build-godex-android.sh')
        }

        if (!missingRuntime.isEmpty()) {
            def runtimeScript = file("${nativeBuildScripts}/build-android-runtime.sh")
            if (!runtimeScript.isFile()) {
                throw new GradleException("Android runtime build script not found: ${runtimeScript}")
            }
            println "Preparing missing Android runtime libraries: ${missingRuntime}"
            exec { commandLine 'bash', runtimeScript.absolutePath }
        }

        if (needsGodexBuild) {
            def godexScript = file("${nativeBuildScripts}/build-godex-android.sh")
            if (!godexScript.isFile()) {
                throw new GradleException("Godex Android build script not found: ${godexScript}")
            }
            println 'Building libgodex.so for Android arm64'
            exec { commandLine 'bash', godexScript.absolutePath }
        }

        def stillMissing = missingNativeLibraries()
        if (!stillMissing.isEmpty()) {
            throw new GradleException("Native libraries are still missing: ${stillMissing}")
        }
    }
}

tasks.register('verifyGodexNativeRuntime') {
    group = 'verification'
    description = 'Fail fast when required Android native runtime libraries are missing.'
    doLast {
        def missing = missingNativeLibraries()
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing Android native libraries: ${missing}. " +
                    "Run './gradlew prepareGodexNativeRuntime' explicitly before building.")
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyGodexNativeRuntime') }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
