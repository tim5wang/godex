<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoDex Wear · 通知（完成 / 待审批，带可执行按钮）</title>
<link rel="stylesheet" href="styles.css">
<style>
  .stack { position:absolute; left:0; right:0; top:70px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .notif .body { font-size:12.5px; color:var(--wg-muted); margin-top:2px; line-height:1.45; }
  .notif .ttl { font-size:14px; font-weight:600; }
  .quick { display:flex; gap:8px; padding-left:50px; margin-top:9px; }
  .mini-btn { font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; border:1px solid var(--wg-border); color:var(--wg-accent); }
  .mini-btn.solid { background:var(--wg-accent); color:var(--wg-accent-ink); border-color:transparent; }
</style>
</head>
<body class="watch">
<div class="stack">
  <div style="width:100%">
    <div class="notif" style="border-color:rgba(34,197,94,.45)">
      <div class="app-ico" style="background:#22c55e;color:#04220f">G</div>
      <div class="grow" style="flex:1;min-width:0">
        <div class="ttl truncate">任务完成 · 重构 auth 中间件</div>
        <div class="body">9/9 步完成，改动 4 个文件，测试通过。点按查看 diff 摘要。</div>
        <div class="quick">
          <span class="mini-btn solid">看摘要</span>
          <span class="mini-btn">让它提交</span>
        </div>
      </div>
    </div>
  </div>

  <div style="width:100%">
    <div class="notif" style="border-color:rgba(239,68,68,.5)">
      <div class="app-ico" style="background:#ef4444;color:#fff">!</div>
      <div style="flex:1;min-width:0">
        <div class="ttl truncate">待审批 · rm -rf ./build</div>
        <div class="body">PC-01 上的 agent 在等你确认，超时 5 分钟后自动拒绝。</div>
        <div class="quick">
          <span class="mini-btn" style="background:#ef4444;color:#fff;border-color:transparent">批准</span>
          <span class="mini-btn" style="background:#243036;color:var(--wg-muted)">拒绝</span>
        </div>
      </div>
    </div>
  </div>

  <div class="mini" style="margin-top:6px">在表盘直接展开按钮 · 无需进 App</div>
</div>
</body>
</html>
