<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoDex Wear · 任务详情（进度 + 最近动作）</title>
<link rel="stylesheet" href="styles.css">
<style>
  .ring-wrap { position: relative; width: 150px; height: 150px; }
  .ring-wrap .mid {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .ring-wrap .mid .pct { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring-wrap .mid .lbl { font-size: 10.5px; color: var(--wg-muted); }
  .arc { transform: rotate(-90deg); transform-origin: 75px 75px; }
  .kv { display: flex; justify-content: space-between; width: 100%; max-width: 316px; font-size: 12.5px; }
  .kv .k { color: var(--wg-dim); }
  .kv .v { font-weight: 600; }
  .log { font-size: 12px; color: var(--wg-muted); line-height: 1.5; text-align: left; max-width: 300px; }
</style>
</head>
<body class="watch">
<div class="screen" style="padding:24px 22px 24px">
  <div class="t-sm truncate" style="max-width:300px">重构 auth 中间件</div>

  <div class="center" style="gap:12px">
    <div class="ring-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="64" fill="none" stroke="#101a1e" stroke-width="9"/>
        <circle class="arc" cx="75" cy="75" r="64" fill="none" stroke="#38bdf8" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="189 402"/>
      </svg>
      <div class="mid">
        <div class="pct">47%</div>
        <div class="lbl">第 4/9 步</div>
      </div>
    </div>

    <div class="kv"><span class="k">执行设备</span><span class="v">PC-01（可信）</span></div>
    <div class="kv"><span class="k">已用时</span><span class="v">12 分 04 秒</span></div>
    <div class="kv"><span class="k">当前工具</span><span class="v">edit_file</span></div>

    <div class="panel" style="max-width:316px;padding:10px 12px">
      <div class="log">● 修改 internal/auth/middleware.go<br>● 跑 go test ./internal/auth<br>○ 待执行：更新 README</div>
    </div>
  </div>

  <div class="bottom">
    <div class="actions2">
      <button class="btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h4v12H6zM14 6h4v12h-4z"/></svg>暂停</button>
      <button class="btn danger"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>停止</button>
    </div>
    <div class="mini">旋表冠滚动 · 返回列表点左上角（不用左右滑）</div>
  </div>
</div>
</body>
</html>
