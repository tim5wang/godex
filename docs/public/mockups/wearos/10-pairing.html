<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoDex Wear · 配对绑定（手表 ↔ 账号）</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pair-top { display:flex; flex-direction:column; align-items:center; gap:9px; }
  .steps { display:flex; gap:5px; }
  .steps i { width:22px; height:3px; border-radius:2px; background:var(--wg-surface-3); }
  .steps i.on { background:var(--wg-accent); }
  .qr-grid { display:flex; align-items:center; gap:14px; }
  .qr-side { display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--wg-muted); max-width:150px; line-height:1.5; }
  .expire { font-size:11px; color:var(--wg-warn); }
</style>
</head>
<body class="watch">
<div class="screen" style="padding:30px 22px 24px">
  <div class="pair-top">
    <div class="steps"><i class="on"></i><i></i><i></i></div>
    <div class="t-md">把这块表接到 godex</div>
    <div class="t-cap">用手机扫码，或用 8 位配对码</div>
  </div>

  <div class="center" style="gap:12px">
    <div class="qr-grid">
      <svg class="qr" viewBox="0 0 29 29" shape-rendering="crispEdges">
        <rect width="29" height="29" fill="#e7eef2"/>
        <g fill="#04070a">
          <path d="M0 0h7v7H0zm1 1v5h5V1zM2 2h3v3H2z"/>
          <path d="M22 0h7v7h-7zm1 1v5h5V1zM23 2h3v3h-3z"/>
          <path d="M0 22h7v7H0zm1 1v5h5v-5zM2 23h3v3H2z"/>
          <path d="M9 0h1v1H9zm2 0h1v1h-1zm2 0h2v1h-2zm3 0h1v2h-1zM9 3h2v1H9zm3 1h1v1h-1zm2-1h1v1h-1zm2 2h1v1h-1z"/>
          <path d="M0 9h1v1H0zm2 0h1v2H2zm3 1h2v1H5zm4 0h1v1H9zm3 0h1v2h-1zm3 0h2v1h-2zm4 0h1v1h-1zm2 0h1v1h-1zm3 0h1v2h-1zm2 0h1v1h-1zm3 0h1v1h-1z"/>
          <path d="M1 12h1v1H1zm4 0h1v2H5zm4 0h2v1H9zm4 1h1v1h-1zm3-1h1v1h-1zm4 1h1v1h-1zm2-1h2v1h-2zm4 0h1v1h-1zm2 1h1v1h-1z"/>
          <path d="M0 15h1v1H0zm2 1h1v1H2zm3 0h1v1H5zm3-1h2v1H8zm4 1h1v1h-1zm3 0h2v1h-2zm4 0h1v2h-1zm3 0h1v1h-1zm3 0h1v1h-1zm2 1h1v1h-1z"/>
          <path d="M1 18h2v1H1zm4 0h1v1H5zm3 0h1v2H8zm3 0h1v1h-1zm3 0h2v1h-2zm4 0h1v1h-1zm3 0h1v1h-1zm2 0h1v2h-1zm3 0h1v1h-1z"/>
          <path d="M9 21h1v1H9zm2 0h1v1h-1zm3 1h1v1h-1zm3 0h2v1h-2zm4 0h1v1h-1zm2 1h1v1h-1zm3 0h1v1h-1z"/>
          <path d="M9 25h1v1H9zm3 0h1v1h-1zm2 0h2v1h-2zm4 0h1v1h-1zm3 1h1v1h-1zm3 0h1v1h-1z"/>
          <path d="M10 27h1v1h-1zm4 0h1v1h-1zm2 0h1v1h-1zm4 0h1v1h-1zm4 0h1v1h-1z"/>
          <path d="M9 1h1v1H9zm4 1h1v1h-1zm3-1h1v1h-1zm4 1h1v1h-1zm4-1h1v1h-1z"/>
          <path d="M9 9h1v1H9zm3 1h1v1h-1zm3-1h1v1h-1zm4 1h1v1h-1zm3-1h1v1h-1z"/>
        </g>
      </svg>
      <div class="qr-side">
        <div>手机 godex App → 我的 → 添加设备 → 扫码</div>
        <div class="expire">二维码 4:58 后失效</div>
      </div>
    </div>

    <div class="panel" style="max-width:290px;padding:11px 14px">
      <div class="mini" style="text-align:center;margin-bottom:5px">或输入配对码</div>
      <div class="code-xl" style="font-size:30px;letter-spacing:6px">4 9 2 7 · 1 8 0 3</div>
    </div>
  </div>

  <div class="bottom">
    <div class="chip">绑定后必须再确认：本表是<b>遥控器</b>，不跑 agent</div>
  </div>
</div>
</body>
</html>
