apply plugin: 'com.android.application'

android {
    namespace = "com.godex.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.godex.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // 关键：强制把 jniLibs 的 .so 解压到 nativeLibraryDir（而非直接从 APK 映射）。
    // 本地模式需 exec libgodex.so / libbusybox.so / libgit.so —— 只有落盘到
    // /data/app/.../lib/arm64（app_lib_file 类型）才能通过 SELinux exec 检查。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- 本地模式运行时 so 自动构建 ----
// libgodex.so / libbusybox.so / libgit.so / libgitremotehttps.so 不入库，
// 由 mobile/scripts/build-godex-android.sh 与 build-android-runtime.sh 生成。
// so 缺失时 preBuild 自动触发（需要 bash + 网络 + Go 工具链）。
def ensureNativeLibs = tasks.register('ensureNativeLibs') {
    def libsDir = file('src/main/jniLibs/arm64-v8a')
    def required = ['libgodex.so', 'libbusybox.so', 'libgit.so', 'libgitremotehttps.so']
    def missingNow = { required.findAll { !file("${libsDir}/${it}").exists() } }
    doLast {
        def missing = missingNow()
        if (missing.isEmpty()) {
            println 'jniLibs/arm64-v8a 运行时 so 已就绪（libgodex/libbusybox/libgit/libgitremotehttps）'
            return
        }
        println "缺失本地运行时 so: ${missing}，自动执行构建脚本..."
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            throw new GradleException('Windows 请使用 Git Bash / WSL 运行: ' +
                    'bash mobile/scripts/build-godex-android.sh && bash mobile/scripts/build-android-runtime.sh')
        }
        def scriptsDir = file("${rootProject.projectDir.parentFile}/scripts")
        if (!file("${scriptsDir}/build-godex-android.sh").exists() || !file("${scriptsDir}/build-android-runtime.sh").exists()) {
            throw new GradleException("找不到构建脚本: ${scriptsDir}（应为 mobile/scripts/）")
        }
        exec { commandLine 'bash', "${scriptsDir}/build-godex-android.sh" }
        exec { commandLine 'bash', "${scriptsDir}/build-android-runtime.sh" }
        def still = missingNow()
        if (!still.isEmpty()) {
            throw new GradleException("本地运行时 so 生成失败，仍缺失: ${still}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn ensureNativeLibs }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
