name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Run release-quality gates
        run: make verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Build and verify release archives
        run: make release VERSION="${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: godex-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
