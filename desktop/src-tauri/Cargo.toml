[package]
name = "godex-desktop"
version = "0.1.0"
description = "Tauri 2 desktop shell for the godex web UI (M1 MVP + M2 native capabilities)"
authors = ["godex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
