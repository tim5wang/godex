<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GoDex Wear · 语音输入（按住说话）</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mic-halo {
    width: 132px; height: 132px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(20,184,166,.28), rgba(20,184,166,.02) 72%);
    border: 1px solid rgba(20,184,166,.3);
  }
  .partial { font-size: 15px; line-height: 1.5; text-align: center; max-width: 280px; min-height: 44px; }
  .partial b { color: var(--wg-accent); }
  .caret { display:inline-block; width:2px; height:15px; background:var(--wg-accent); vertical-align:-3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .target { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--wg-muted); }
</style>
</head>
<body class="watch">
<div class="screen" style="padding:28px 22px 24px">
  <div class="st-top" style="width:200px">
    <span class="target"><span class="dot ok"></span> 目标：PC-01 · 会话「重构 auth」</span>
  </div>

  <div class="center" style="gap:14px">
    <div class="mic-halo">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="#14b8a6"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </div>

    <div class="wave">
      <i style="height:14px"></i><i style="height:30px"></i><i style="height:44px"></i>
      <i style="height:22px"></i><i style="height:52px"></i><i style="height:34px"></i>
      <i style="height:18px"></i><i style="height:40px"></i><i style="height:26px"></i>
      <i style="height:12px"></i>
    </div>

    <div class="partial">把这个任务的结果<b>整理成 release notes</b> 发我<span class="caret"></span></div>
    <div class="mini">松开即发送 · 上滑取消 · 语音转写在本机完成</div>
  </div>

  <div class="bottom">
    <div class="actions3">
      <button class="btn btn-round" aria-label="切到文本输入">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18v3H3zm4 5h10v3H7zm-4 5h18v3H3zm4 5h10v3H7z"/></svg>
      </button>
      <button class="btn btn-round big accent" aria-label="停止录音">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#03211f"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button class="btn btn-round" aria-label="取消">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
