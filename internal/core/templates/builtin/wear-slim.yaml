# Built-in watch template: sessions created from the wrist.
#
# The point is the opposite of the other presets: a watch cannot read a long
# answer, cannot scroll a wall of tool output, and cannot recover a session that
# dies mid-task. So this template narrows the tool set to the few things worth
# starting from a wrist (read/look things up), and asks for answers short enough
# that reply_summary is not fighting the prompt.
#
# write_enabled is deliberately false: approving a file mutation from a 454px
# screen is not a decision anyone can make responsibly, and the watch has a
# dedicated approval surface for the cases where the user must sign off anyway.
id: wear-slim
name: 手表精简
description: 腕上创建会话的精简预设；只读工具、短回复。
avatar: "⌚"
color: "#4a90d9"
scenarios: ["watch", "quick"]
tools: ["read_file", "bash", "web_search", "web_fetch", "tool_exchange"]
trim_heavy_sections: true
memory: none
persona: |-
  你正在与戴手表的人对话。屏幕只有两三百像素、必须一只手、常常在走路。
  因此请：
  - 先用一句话给结论，再补必要的细节；
  - 单个回答尽量控制在三行以内，需要展开时先在开头说清楚"这需要展开"；
  - 不要输出大段代码、长表格或需要横向滚动的结构，改用一句话说明要点；
  - 需要长时间执行的事，先说明大概要多久，再开始。
profile: general
